services:
  database:
    image: postgres:16.14-alpine
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # The postgres image requires these literal names, and they differ from the
    # schema's, so these three are the only interpolated values in this file.
    # Compose interpolates what it substitutes, so a value containing `$` would
    # be truncated here; everything else uses the pass-through shorthand below
    # and is immune. They are read only when the data volume is first
    # initialised, which already happened — changing them does not change the
    # live role's password.
    environment:
      POSTGRES_DB: ${TMTERMINAL_DATABASE_NAME}
      POSTGRES_PASSWORD: ${TMTERMINAL_DATABASE_PASSWORD}
      POSTGRES_USER: ${TMTERMINAL_DATABASE_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_DATABASE_PUBLISHED_PORT:-5437}:5432"
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data

  migrate:
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "db:migrate"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    # Pass-through shorthand: Compose takes each value straight from the process
    # environment (delivered by `varlock run`) without interpolating it, so a
    # value containing `$` survives intact.
    environment:
      - TMTERMINAL_DATABASE_URL
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
      secrets:
        - merchbase_hugeicons_license_key
        - merchbase_github_npm_token
      args:
        TMTERMINAL_REVISION: ${TMTERMINAL_REVISION:-development}
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "start"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      - MERCHBASE_CLERK_ISSUER
      - MERCHBASE_CLERK_JWT_KEY
      - MERCHBASE_CLERK_PUBLISHABLE_KEY
      - MERCHBASE_CLERK_SECRET_KEY
      - TMTERMINAL_CLERK_AUTHORIZED_PARTIES
      - TMTERMINAL_CLERK_WEBHOOK_SIGNING_SECRET
      - TMTERMINAL_DATABASE_URL
      - TMTERMINAL_HOST
      - TMTERMINAL_MCP_RESOURCE_URL
      - TMTERMINAL_PORT
      # The container's own lifecycle signal. VARLOCK_ENV is a varlock builtin
      # and is never delivered, so in-container branching reads this instead.
      - NODE_ENV=production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health');if(!r.ok)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_API_PORT:?set TMTERMINAL_API_PORT}:3000"
    restart: unless-stopped

  worker:
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "worker"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      - MERCHBASE_CLERK_ISSUER
      - MERCHBASE_CLERK_JWT_KEY
      - MERCHBASE_CLERK_PUBLISHABLE_KEY
      - MERCHBASE_CLERK_SECRET_KEY
      - TMTERMINAL_ARTIFACT_STORE_ROOT
      - TMTERMINAL_CLERK_AUTHORIZED_PARTIES
      - TMTERMINAL_DATABASE_URL
      - TMTERMINAL_USPTO_API_KEY
      - TMTERMINAL_USPTO_REQUEST_TIMEOUT_MS
      - NODE_ENV=production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "if(Date.now()-Number(await Bun.file('/tmp/tmterminal-worker-ready').text())>30000)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15m
    restart: unless-stopped
    volumes:
      - artifact-data:/var/lib/tmterminal/artifacts

  web:
    build:
      context: .
      target: web
      secrets:
        - merchbase_hugeicons_license_key
        - merchbase_github_npm_token
      args:
        TMTERMINAL_REVISION: ${TMTERMINAL_REVISION:-development}
        VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY: ${VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY:?set VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY}
    image: tmterminal-web:${TMTERMINAL_REVISION:-development}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_WEB_PORT:?set TMTERMINAL_WEB_PORT}:8080"
    restart: unless-stopped

  test-database:
    profiles: ["test"]
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: tmterminal_test
      POSTGRES_PASSWORD: tmterminal_test
      POSTGRES_USER: tmterminal_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmterminal_test -d tmterminal_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-test:
    profiles: ["test"]
    build:
      context: .
      target: test
      secrets:
        - merchbase_hugeicons_license_key
        - merchbase_github_npm_token
    command: ["bun", "run", "test:integration"]
    # Runtime-provided: the integration lane supplies its own connection string.
    # Inside this profile that is the container-network form below; an operator
    # or cloud agent supplies a loopback form instead.
    environment:
      TMTERMINAL_TEST_DATABASE_URL: postgres://tmterminal_test:tmterminal_test@test-database:5432/tmterminal_test
    depends_on:
      test-database:
        condition: service_healthy

volumes:
  artifact-data:
  database-data:

secrets:
  merchbase_hugeicons_license_key:
    environment: MERCHBASE_HUGEICONS_LICENSE_KEY
  merchbase_github_npm_token:
    environment: MERCHBASE_GITHUB_NPM_TOKEN
