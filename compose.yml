services:
  database:
    image: postgres:16.14-alpine
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmturtle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-tmturtle}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data

  migrate:
    image: tmturtle-core:${TMTURTLE_REVISION:-development}
    command: ["bun", "run", "db:migrate"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
      args:
        TMTURTLE_REVISION: ${TMTURTLE_REVISION:-development}
    image: tmturtle-core:${TMTURTLE_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "start"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health');if(!r.ok)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTURTLE_API_PORT:?set TMTURTLE_API_PORT}:3000"
    restart: unless-stopped

  worker:
    image: tmturtle-core:${TMTURTLE_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "worker"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      ARTIFACT_STORE_ROOT: /var/lib/tmturtle/artifacts
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      USPTO_API_KEY: ${USPTO_API_KEY:?set USPTO_API_KEY}
      USPTO_DISCOVERY_INTERVAL_MS: ${USPTO_DISCOVERY_INTERVAL_MS:-21600000}
      USPTO_REQUEST_TIMEOUT_MS: ${USPTO_REQUEST_TIMEOUT_MS:-900000}
      USPTO_RETRY_BASE_MS: ${USPTO_RETRY_BASE_MS:-30000}
      USPTO_RETRY_MAX_ATTEMPTS: ${USPTO_RETRY_MAX_ATTEMPTS:-8}
      USPTO_RETRY_MAX_MS: ${USPTO_RETRY_MAX_MS:-21600000}
      USPTO_SCHEDULER_POLL_MS: ${USPTO_SCHEDULER_POLL_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "if(Date.now()-Number(await Bun.file('/tmp/tmturtle-worker-ready').text())>30000)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15m
    restart: unless-stopped
    volumes:
      - artifact-data:/var/lib/tmturtle/artifacts

  web:
    build:
      context: .
      target: web
      args:
        TMTURTLE_REVISION: ${TMTURTLE_REVISION:-development}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY}
    image: tmturtle-web:${TMTURTLE_REVISION:-development}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTURTLE_WEB_PORT:?set TMTURTLE_WEB_PORT}:8080"
    restart: unless-stopped

  test-database:
    profiles: ["test"]
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: tmturtle_test
      POSTGRES_PASSWORD: tmturtle_test
      POSTGRES_USER: tmturtle_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmturtle_test -d tmturtle_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["bun", "run", "test:integration"]
    environment:
      TEST_DATABASE_URL: postgres://tmturtle_test:tmturtle_test@test-database:5432/tmturtle_test
    depends_on:
      test-database:
        condition: service_healthy

volumes:
  artifact-data:
  database-data:
