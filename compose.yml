services:
  database:
    image: postgres:16.14-alpine
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmterminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-tmterminal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_DATABASE_PORT:-5437}:5432"
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data

  migrate:
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "db:migrate"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
      secrets:
        - hugeicons_license_key
        - node_auth_token
      args:
        TMTERMINAL_REVISION: ${TMTERMINAL_REVISION:-development}
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "start"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES}
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?set CLERK_JWT_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-https://tmterminal.merchbase.co/mcp}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health');if(!r.ok)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_API_PORT:?set TMTERMINAL_API_PORT}:3000"
    restart: unless-stopped

  worker:
    image: tmterminal-core:${TMTERMINAL_REVISION:-development}
    command: ["bun", "run", "--cwd", "apps/server", "worker"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      ARTIFACT_STORE_ROOT: /var/lib/tmterminal/artifacts
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES}
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?set CLERK_JWT_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      USPTO_API_KEY: ${USPTO_API_KEY:?set USPTO_API_KEY}
      USPTO_REQUEST_TIMEOUT_MS: ${USPTO_REQUEST_TIMEOUT_MS:-900000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "if(Date.now()-Number(await Bun.file('/tmp/tmterminal-worker-ready').text())>30000)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15m
    restart: unless-stopped
    volumes:
      - artifact-data:/var/lib/tmterminal/artifacts

  web:
    build:
      context: .
      target: web
      secrets:
        - hugeicons_license_key
        - node_auth_token
      args:
        TMTERMINAL_REVISION: ${TMTERMINAL_REVISION:-development}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY}
    image: tmterminal-web:${TMTERMINAL_REVISION:-development}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${TMTERMINAL_WEB_PORT:?set TMTERMINAL_WEB_PORT}:8080"
    restart: unless-stopped

  test-database:
    profiles: ["test"]
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: tmterminal_test
      POSTGRES_PASSWORD: tmterminal_test
      POSTGRES_USER: tmterminal_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmterminal_test -d tmterminal_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-test:
    profiles: ["test"]
    build:
      context: .
      target: test
      secrets:
        - hugeicons_license_key
        - node_auth_token
    command: ["bun", "run", "test:integration"]
    environment:
      TEST_DATABASE_URL: postgres://tmterminal_test:tmterminal_test@test-database:5432/tmterminal_test
    depends_on:
      test-database:
        condition: service_healthy

volumes:
  artifact-data:
  database-data:

secrets:
  hugeicons_license_key:
    environment: HUGEICONS_LICENSE_KEY
  node_auth_token:
    environment: NODE_AUTH_TOKEN
