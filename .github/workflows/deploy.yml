name: Deploy Stack

# GitHub Actions owns production deploys. A release PR bumps VERSION; merging
# that change to main ships the revision after the full check preflight.
# Ordinary main merges do not deploy. workflow_dispatch redeploys current main.
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: tmterminal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
    with:
      lint-base: ${{ github.event.before || 'HEAD^' }}

  deploy:
    name: Deploy Stack
    needs: quality
    # The stack is hosted on the Mac mini, so GitHub Actions stays the single
    # deploy surface and the job runs on the mini's self-hosted runner.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sync the deployment checkout
        working-directory: /Users/zknicker/srv/tmterminal
        run: |
          set -euo pipefail
          # Fetch the branch, not just the commit: scripts/deployment-revision
          # requires HEAD to equal origin/main, and fetching a bare SHA leaves
          # the remote-tracking ref behind.
          git fetch origin main
          git reset --hard "${GITHUB_SHA}"
          git rev-parse HEAD

      - name: Deploy
        working-directory: /Users/zknicker/srv/tmterminal
        env:
          # The deploy-agent role slot, filled here by the GitHub deploy agent's
          # read-only Production identity. The deploy script pins
          # VARLOCK_ENV=production and resolves every value through the schema;
          # no .env file is read and none is written.
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
          # The same identity also fills the development slot: it reads both
          # lifecycle vaults, so the deploy script's install-switch
          # `varlock printenv` calls resolve the GitHub Packages read token and
          # the licensed @hugeicons-pro key from the Development vault. Actions'
          # own `github.token` is deliberately not used for package installs —
          # it cannot download another repository's GitHub Package.
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: bun run deploy

      - name: Verify from the consumer
        run: |
          body="$(curl --show-error --silent --max-time 20 \
            https://tmterminal.merchbase.co/health/live || true)"
          if [ "$body" != "{\"status\":\"ok\",\"revision\":\"${GITHUB_SHA}\"}" ]; then
            printf '%s\n' "$body" >&2
            exit 1
          fi
          echo "Public liveness endpoint OK."

  notify:
    name: Notify Haus
    # A step on deploy never starts when quality fails or the preflight is
    # cancelled. This job is the only reporter, and it stays off the mini
    # because the mini is the thing that fails.
    needs: [quality, deploy]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Notify Haus
        continue-on-error: true
        timeout-minutes: 1
        env:
          HAUS_DEPLOY_TRIGGER_URL: ${{ secrets.HAUS_DEPLOY_TRIGGER_URL }}
          HAUS_DEPLOY_TRIGGER_TOKEN: ${{ secrets.HAUS_DEPLOY_TRIGGER_TOKEN }}
          NEEDS_JSON: ${{ toJson(needs) }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${HAUS_DEPLOY_TRIGGER_URL}" ] || [ -z "${HAUS_DEPLOY_TRIGGER_TOKEN}" ]; then
            echo "::notice::Haus deploy notify skipped; secrets are not configured."
            exit 0
          fi

          conclusion="$(printf '%s' "${NEEDS_JSON}" | jq -r '
            if any(.[]; .result == "failure") then "failure" else "cancelled" end
          ')"
          failed_step="$(printf '%s' "${NEEDS_JSON}" | jq -r '
            (
              [to_entries[] | select(.value.result == "failure") | .key]
              + [to_entries[] | select(.value.result == "cancelled") | .key]
            )
            | if length == 0 then "unknown" else .[0] end
          ')"

          payload="$(jq -nc \
            --arg repo "${REPO}" \
            --arg workflow "${WORKFLOW}" \
            --arg run_url "${RUN_URL}" \
            --arg sha "${SHA}" \
            --arg ref "${REF}" \
            --arg conclusion "${conclusion}" \
            --arg failed_step "${failed_step}" \
            '{repo:$repo, workflow:$workflow, run_url:$run_url, sha:$sha, ref:$ref, conclusion:$conclusion, failed_step:$failed_step}')"

          echo "Notifying Haus (${conclusion}): ${failed_step}"
          curl --silent --fail --output /dev/null --max-time 10 \
            --request POST \
            --header "Authorization: Bearer ${HAUS_DEPLOY_TRIGGER_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: tmterminal-deploy-notify" \
            --data "${payload}" \
            --url "${HAUS_DEPLOY_TRIGGER_URL}" \
            || echo "::warning::Haus deploy notify did not complete."
