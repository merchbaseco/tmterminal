name: Deploy

on:
  workflow_dispatch:
    inputs:
      auth-cleanup-approved:
        description: Confirm dependency, backup/restore, migration, and deploy approvals
        required: true
        type: boolean

concurrency:
  group: tmterminal-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
    with:
      lint-base: ${{ github.event.before || 'HEAD^' }}

  deploy:
    if: inputs.auth-cleanup-approved == true
    needs: quality
    runs-on: self-hosted
    steps:
      - name: Deploy exact main revision
        env:
          HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: /Users/zknicker/srv/tmterminal
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          export TMTERMINAL_REVISION="$(./scripts/deployment-revision "$GITHUB_SHA")"
          docker compose --project-name tmterminal --env-file .env build
          docker compose --project-name tmterminal --env-file .env stop api worker
          docker compose --project-name tmterminal --env-file .env up --detach --wait database
          cleanup_state="$(./scripts/auth-cleanup-inventory state)"
          case "$cleanup_state" in
            pre)
              preservation_before="$(./scripts/auth-cleanup-inventory capture)"
              ./scripts/auth-cleanup-inventory verify-pre
              docker compose --project-name tmterminal --env-file .env run --rm migrate
              preservation_after="$(./scripts/auth-cleanup-inventory capture)"
              test "$preservation_before" = "$preservation_after"
              ./scripts/auth-cleanup-inventory verify-final
              ;;
            final)
              ./scripts/auth-cleanup-inventory verify-final
              docker compose --project-name tmterminal --env-file .env run --rm migrate
              ./scripts/auth-cleanup-inventory verify-final
              ;;
            *)
              echo "unsupported auth cleanup schema state" >&2
              exit 1
              ;;
          esac
          docker compose --project-name tmterminal --env-file .env up --detach --remove-orphans --wait
          ./scripts/deployment-smoke
