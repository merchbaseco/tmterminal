name: Deploy

on:
  workflow_dispatch:
    inputs:
      centralized-auth-cutover-approved:
        description: Confirm mapping, backup/restore, Clerk, and deploy approvals
        required: true
        type: boolean

concurrency:
  group: tmterminal-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
    with:
      lint-base: ${{ github.event.before || 'HEAD^' }}

  deploy:
    if: inputs.centralized-auth-cutover-approved == true
    needs: quality
    runs-on: self-hosted
    steps:
      - name: Deploy exact main revision
        env:
          HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: /Users/zknicker/srv/tmterminal
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          export TMTERMINAL_REVISION="$(./scripts/deployment-revision "$GITHUB_SHA")"
          docker compose --project-name tmterminal --env-file .env build
          docker compose --project-name tmterminal --env-file .env stop worker
          docker compose --project-name tmterminal --env-file .env up --detach --remove-orphans --wait
          ./scripts/deployment-smoke
