name: Quality

on:
  pull_request:
  workflow_call:
    inputs:
      lint-base:
        required: true
        type: string
    secrets:
      HUGEICONS_LICENSE_KEY:
        required: true

permissions:
  contents: read

jobs:
  verify:
    env:
      HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed authored files
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || inputs.lint-base }}
        run: bun run lint:changed
      - name: Typecheck and unit tests
        run: bun run check
      - name: Build all workspaces
        run: bun run build
      - name: Test fixture tooling
        run: bun run test:fixtures
      - name: Verify generated migration history
        run: |
          bun run db:generate
          git diff --exit-code -- apps/server/drizzle
      - name: Run production-shaped PostgreSQL integration tests
        run: bun run test:integration:compose
