<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="#d7f52a" name="theme-color">
    <script>
    "use strict";
    const appearance = localStorage.getItem("tmturtle-appearance");
    const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle(
      "dark",
      appearance === "dark" || (appearance !== "light" && systemDark)
    );
    </script>
    <title>Trademark Turtle</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
